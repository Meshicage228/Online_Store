<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.title} + ' | Магазин'">Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="product-page">
    <div class="product-container">
        <div class="product-layout">
            <div class="product-gallery">
                <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div th:each="photo, number : ${product.getImages()}"
                             th:class="'carousel-item ' + (${number.index == 0} ? 'active' : '')">
                            <img th:src="@{'data:image/png;base64,'+${photo.getConvertedImage()}}"
                                 alt="Изображение товара"
                                 class="product-main-image">
                        </div>
                    </div>

                    <div th:if="${product.getImages().size()} > 1">
                        <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                            <i class="fas fa-chevron-left"></i>
                            <span class="visually-hidden">Предыдущее</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                            <i class="fas fa-chevron-right"></i>
                            <span class="visually-hidden">Следующее</span>
                        </button>
                    </div>
                </div>

                <div class="product-actions">
                    <a th:href="@{/store/users/add_favorite/{prod_id}(prod_id = ${product.id})}"
                       class="favorite-action-btn">
                        <i class="fas fa-heart"></i>
                        В избранное
                    </a>

                    <div sec:authorize="hasAuthority('ADMIN')" class="admin-actions">
                        <form th:action="@{/admin/products/{product_id}(product_id = ${product.id})}" th:method="get">
                            <button type="submit" class="btn-edit">
                                <i class="fas fa-edit me-2"></i>
                                Редактировать товар
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="product-info">
                <div class="product-header">
                    <h1 class="product-title" th:text="${product.title}"></h1>
                    <div class="product-price" th:text="${product.price} + ' BYN'"></div>
                </div>

                <div class="product-description-section">
                    <h3 class="section-title">
                        <i class="fas fa-info-circle me-2"></i>
                        Описание
                    </h3>
                    <p class="product-description" th:text="${product.description}"></p>
                </div>

                <div class="purchase-section">
                    <div th:replace="~{fragments :: addToCart(${product.id})}"></div>

                    <div class="product-features">
                        <div class="feature-item">
                            <i class="fas fa-shipping-fast feature-icon"></i>
                            <span>Бесплатная доставка</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-shield-alt feature-icon"></i>
                            <span>Гарантия качества</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-undo feature-icon"></i>
                            <span>Возврат 14 дней</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="comments-section">
            <div class="comments-header">
                <h2 class="section-title">
                    <i class="fas fa-comments me-2"></i>
                    Отзывы покупателей
                    <span class="comments-count" th:text="'(' + ${product.getComments().size()} + ')'"></span>
                </h2>
            </div>

            <form th:method="post" th:action="@{/store/users/comment/{prod_id}(prod_id = ${product.id})}" class="comment-form">
                <div class="form-group">
                    <textarea name="commentary" class="comment-input"
                              placeholder="Поделитесь вашим мнением о товаре..."
                              rows="3"></textarea>
                </div>
                <button type="submit" class="btn-comment">
                    <i class="fas fa-paper-plane me-2"></i>
                    Оставить отзыв
                </button>
            </form>

            <div th:if="${userNotBought != null}" class="alert alert-error">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${userNotBought}"></span>
            </div>
            <div th:if="${emptyCommentary != null}" class="alert alert-error">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${emptyCommentary}"></span>
            </div>

            <div class="comments-list">
                <div th:each="comment : ${product.getComments()}" class="comment-card">
                    <div class="comment-header">
                        <div class="user-info">
                            <img th:src="@{'data:image/png;base64,'+${comment.getUserAvatar()}}"
                                 alt="Аватар пользователя"
                                 class="user-avatar">
                            <div class="user-details">
                                <div class="user-name" th:text="${comment.getName()}"></div>
                                <div class="comment-date" th:text="${comment.getDate()}"></div>
                            </div>
                        </div>

                        <div sec:authorize="hasAuthority('ADMIN')" class="comment-actions">
                            <form th:action="@{/admin/users/deleteComment/{comment_id}/{prod_id}(comment_id = ${comment.id}, prod_id = ${product.id})}"
                                  th:method="post">
                                <button type="submit" class="btn-delete-comment" title="Удалить комментарий">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="comment-content">
                        <p class="comment-text" th:text="${comment.getComment()}"></p>
                    </div>
                </div>

                <div th:if="${product.getComments().isEmpty()}" class="empty-comments">
                    <i class="fas fa-comment-slash empty-icon"></i>
                    <h4>Пока нет отзывов</h4>
                    <p>Будьте первым, кто оставит отзыв об этом товаре!</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
