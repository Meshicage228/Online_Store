<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Vlad's Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="cart-page">
    <div class="cart-container">
        <div class="cart-layout">
            <div th:replace="~{fragments :: user-navigation}"></div>

            <div class="cart-content">
                <div class="cart-header">
                    <h1 class="cart-title">Корзина покупок</h1>
                    <div class="cart-count" th:text="'Товаров: ' + ${countProducts}"></div>
                </div>

                <div th:if="${notEnoughMoney != null}" class="alert alert-danger alert-cart-main">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${notEnoughMoney}"></span>
                </div>

                <div class="cart-items">
                    <div th:if="${userInfo.getBasket().isEmpty()}" class="empty-cart">
                        <div class="empty-cart-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <h3 class="empty-cart-title">Корзина пуста</h3>
                        <p class="empty-cart-text">Добавьте товары из каталога, чтобы сделать заказ</p>
                        <a th:href="@{/store/0/10}" class="shop-btn">
                            <i class="fas fa-store me-2"></i>
                            Перейти в магазин
                        </a>
                    </div>

                    <div th:each="product : ${userInfo.getBasket()}" class="cart-item">
                        <img th:src="@{'data:image/png;base64,'+${product.getImages().get(0).getConvertedImage()}}"
                             alt="Product image"
                             class="cart-item-image">

                        <div class="cart-item-info">
                            <h4 class="cart-item-title" th:text="${product.getTitle()}"></h4>
                            <p class="cart-item-description" th:text="${product.getDescription()}"></p>
                        </div>

                        <div class="cart-item-quantity">
                            <form th:method="patch"
                                  th:action="@{/store/users/cart/{basket_id}/changeCount(basket_id = ${product.getCart_id()})}">
                                <button type="submit" name="option" value="decrement"
                                        class="quantity-btn"
                                        th:disabled="${product.count == 1}">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </form>

                            <input type="text"
                                   th:value="${product.getCount()}"
                                   class="quantity-input"
                                   readonly>

                            <form th:method="patch"
                                  th:action="@{/store/users/cart/{basket_id}/changeCount(basket_id = ${product.getCart_id()})}">
                                <button type="submit" name="option" value="increment"
                                        class="quantity-btn">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </form>
                        </div>

                        <div class="cart-item-price" th:text="${product.getBill()} + ' BYN'"></div>

                        <div class="cart-item-remove">
                            <form th:action="@{/store/users/cart/{cart_id}(cart_id = ${product.getCart_id()})}"
                                  th:method="delete">
                                <button type="submit" class="cart-remove-btn" title="Удалить из корзины">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${!userInfo.getBasket().isEmpty()}" class="cart-summary">
                <div class="summary-header">
                    <h3 class="summary-title">Детали заказа</h3>
                </div>

                <div class="summary-items">
                    <span class="summary-label">Товары:</span>
                    <span class="summary-value" th:text="${countProducts}"></span>
                </div>

                <div class="summary-total">
                    <span class="total-label">Итого:</span>
                    <span class="total-value" th:text="${totalBill} + ' BYN'"></span>
                </div>

                <form th:method="post" th:action="@{/store/users/cart/order/create}">
                    <button type="submit" class="checkout-btn">
                        <i class="fas fa-credit-card me-2"></i>
                        Оформить заказ
                    </button>
                </form>

                <div th:if="${noCardFound != null}" class="cart-payment-section">
                    <div class="alert alert-cart alert-danger">
                        <i class="fas fa-credit-card me-2"></i>
                        <span th:text="${noCardFound}"></span>
                    </div>

                    <div class="cart-payment-card">
                        <div class="cart-payment-header">
                            <h4 class="cart-payment-title">Добавить карту</h4>
                            <div class="cart-payment-types">
                                <i class="fab fa-cc-mastercard cart-card-type"></i>
                                <i class="fab fa-cc-visa cart-card-type"></i>
                                <i class="fab fa-cc-amex cart-card-type"></i>
                            </div>
                        </div>

                        <form th:action="@{/store/users/addCard}" th:method="post" class="cart-payment-form">
                            <div class="cart-form-group">
                                <input type="text"
                                       name="cardholderName"
                                       class="cart-payment-input"
                                       placeholder="Владелец карты"
                                       required>
                            </div>

                            <div class="cart-form-group">
                                <input type="text"
                                       name="cardNumber"
                                       class="cart-payment-input"
                                       placeholder="1234 5678 9012 3457"
                                       maxlength="19"
                                       required>
                            </div>

                            <div class="cart-payment-row">
                                <div class="cart-form-group">
                                    <input type="text"
                                           name="expiryDate"
                                           class="cart-payment-input"
                                           placeholder="ММ/ГГ"
                                           maxlength="5"
                                           required>
                                </div>
                                <div class="cart-form-group">
                                    <input type="password"
                                           name="cvv"
                                           class="cart-payment-input"
                                           placeholder="CVV"
                                           maxlength="3"
                                           required>
                                </div>
                            </div>

                            <button type="submit" class="cart-add-card-btn">
                                <i class="fas fa-plus me-2"></i>
                                Добавить карту
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
