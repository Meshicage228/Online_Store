<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранные товары | Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="favorites-page">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-3 col-md-4">
                <div th:replace="~{fragments :: user-navigation}"></div>
            </div>

            <div class="col-lg-9 col-md-8">
                <div class="favorites-main">
                    <div class="favorites-header">
                        <div class="header-content">
                            <div class="title-section">
                                <i class="fas fa-heart title-icon"></i>
                                <div>
                                    <h1 class="page-title">Избранное</h1>
                                    <p class="page-subtitle">Товары, которые вам понравились</p>
                                </div>
                            </div>
                            <div class="counter-badge" th:text="${userInfo.getFavoriteProducts().size()} + ' товаров'"></div>
                        </div>
                    </div>

                    <div class="favorites-content">
                        <div th:replace="~{fragments :: notFoundByFilter(${userInfo.getFavoriteProducts().size()})}"></div>

                        <div class="products-grid">
                            <div th:each="prod : ${userInfo.getFavoriteProducts()}" class="product-card">
                                <div class="card-image">
                                    <a th:href="@{/store/catalog/{prod_id}(prod_id = ${prod.id})}" class="image-link">
                                        <img th:src="@{'data:image/png;base64,'+${prod.getImages().get(0).convertedImage}}"
                                             alt="Изображение товара"
                                             class="product-img">
                                        <div class="image-overlay">
                                            <span class="view-text">Посмотреть товар</span>
                                        </div>
                                    </a>

                                    <a th:href="@{/store/users/remove_favorite/{prod_id}(prod_id = ${prod.id})}"
                                       class="remove-btn"
                                       title="Удалить из избранного">
                                        <i class="fas fa-times"></i>
                                    </a>

                                    <div th:if="${prod.id % 7 == 0}" class="product-label new-label">Новинка</div>
                                </div>

                                <div class="card-body">
                                    <h3 class="product-name" th:text="${prod.title}"></h3>
                                    <p class="product-desc" th:text="${prod.description}"></p>

                                    <div class="card-footer">
                                        <div class="price" th:text="${prod.price} + ' BYN'"></div>
                                        <div th:replace="~{fragments :: addToCart(${prod.id})}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
