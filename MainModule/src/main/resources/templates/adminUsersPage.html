<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <link href="/css/App.css" rel="stylesheet">
    <title>Пользователи | Админ-панель</title>
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="admin-page">
    <div class="admin-container">
        <div class="admin-layout">
            <div th:replace="~{fragments :: admin-navigation}"></div>

            <div class="admin-content">
                <div class="admin-header">
                    <h1 class="admin-title">
                        <i class="fas fa-users me-3"></i>
                        Управление пользователями
                    </h1>
                </div>

                <div class="search-section">
                    <form th:action="@{/admin/users/{page}/{size}(page = ${totalPage.number}, size = ${totalPage.size})}"
                          class="search-form-users">
                        <div class="search-container">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text"
                                   name="name"
                                   class="search-input"
                                   placeholder="Поиск пользователей по имени..."
                                   th:value="${searchedName}">
                            <button type="submit" class="search-btn">
                                <i class="fas fa-search me-2"></i>
                                Найти
                            </button>
                        </div>
                    </form>
                </div>

                <div class="users-grid-section">
                    <div class="users-grid">
                        <div class="user-card" th:each="user : ${totalPage.getContent()}">
                            <div class="user-card-header">
                                <img th:src="@{'data:image/png;base64,'+${user.getAvatar()}}"
                                     alt="Аватар пользователя"
                                     class="user-avatar-md">
                            </div>
                            <div class="user-card-body">
                                <h3 class="user-name" th:text="${user.name}"></h3>
                                <span class="user-role-badge" th:text="${user.role}"></span>
                            </div>
                            <div class="user-card-footer">
                                <form th:action="@{/admin/users/{id}(id = ${user.id})}"
                                      th:method="delete"
                                      class="d-grid">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="fas fa-trash me-2"></i>
                                        Удалить
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div th:insert="~{fragments :: notFoundByFilter (${totalPage.getContent().size()})}"></div>
                </div>

                <div th:if="${totalPage.getTotalPages() > 1}" class="pagination-section">
                    <nav aria-label="Навигация по страницам">
                        <ul class="pagination">
                            <li class="page-item" aria-current="page" th:each="iterPage : ${countPages}">
                                <form th:action="@{/admin/users/{page}/{size}(page = ${iterPage - 1}, size = ${totalPage.size})}"
                                      th:method="get">
                                    <button th:value="${searchedName}"
                                            th:text="${iterPage}"
                                            th:class="'page-link ' + ${totalPage.number == iterPage - 1 ? 'active' : ''}"
                                            th:name="${searchedName != null ? 'name' : ''}"
                                            class="page-link">
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
