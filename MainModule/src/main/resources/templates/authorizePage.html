<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">Регистрация</h1>
                        <p class="auth-subtitle">Создайте новый аккаунт</p>
                    </div>

                    <div class="auth-body">
                        <form th:action="@{/store/authorize}" method="post" th:object="${enterUser}">
                            <div class="form-group">
                                <input th:field="*{nameAuth}"
                                       type="text"
                                       class="auth-input"
                                       placeholder="Введите логин"
                                       th:classappend="${#fields.hasErrors('nameAuth')} ? 'is-invalid' : ''">
                                <div th:if="${#fields.hasErrors('nameAuth')}" class="invalid-feedback">
                                    <i class="fas fa-exclamation-circle me-1"></i>
                                    <span th:errors="*{nameAuth}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <input th:field="*{password}"
                                       type="password"
                                       class="auth-input"
                                       placeholder="Придумайте пароль"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                                    <i class="fas fa-exclamation-circle me-1"></i>
                                    <span th:errors="*{password}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <input th:field="*{doublePass}"
                                       type="password"
                                       class="auth-input"
                                       placeholder="Подтвердите пароль"
                                       th:classappend="${#fields.hasErrors('doublePass')} ? 'is-invalid' : ''">
                                <div th:if="${#fields.hasErrors('doublePass')}" class="invalid-feedback">
                                    <i class="fas fa-exclamation-circle me-1"></i>
                                    <span th:errors="*{doublePass}"></span>
                                </div>
                            </div>

                            <button type="submit" class="auth-btn">
                                <i class="fas fa-user-plus me-2"></i>
                                Создать аккаунт
                            </button>
                        </form>

                        <div th:if="${passNotMatch != null}" class="alert alert-auth alert-danger mt-3">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span th:text="${passNotMatch}"></span>
                        </div>
                        <div th:if="${usersExits != null}" class="alert alert-auth alert-danger mt-3">
                            <i class="fas fa-user-times me-2"></i>
                            <span th:text="${usersExits}"></span>
                        </div>
                    </div>
                    <div class="auth-footer">
                        <a th:href="@{/store/0/10}" class="auth-link">
                            <i class="fas fa-arrow-left me-1"></i>
                            Вернуться на главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
