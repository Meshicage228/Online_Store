<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Vlad's Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">Добро пожаловать!</h1>
            <p class="login-subtitle">Войдите в свой аккаунт</p>
        </div>

        <div class="login-body">
            <form th:action="@{/store/login}" th:method="post" th:object="${enterUser}" class="login-form">
                <div class="form-group">
                    <input type="text"
                           th:field="*{loginAuth}"
                           class="login-input"
                           placeholder="Введите ваш логин"
                           th:classappend="${#fields.hasErrors('loginAuth')} ? 'is-invalid' : ''"
                           required>
                    <i class="fas fa-user login-input-icon"></i>
                    <div th:if="${#fields.hasErrors('loginAuth')}" class="invalid-feedback">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        <span th:errors="*{loginAuth}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password"
                           th:field="*{password}"
                           class="login-input"
                           placeholder="Введите ваш пароль"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           required>
                    <i class="fas fa-lock login-input-icon"></i>
                    <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Войти в аккаунт
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p class="mb-0">
                Ещё нет аккаунта?
                <a th:href="@{/store/authorize}" class="login-link">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
