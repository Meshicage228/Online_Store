<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments :: header}"></div>

<main class="storeMainContent">
    <section class="search-section">
        <div class="container">
            <form th:action="@{/store/{page}/{size}(page = ${totalPage.number}, size = ${totalPage.size})}"
                  th:method="get" class="search-form">
                <div class="filter-buttons">
                    <button type="submit"
                            name="sortedBy"
                            value="priceUp"
                            th:class="'filter-btn ' + (${sort == 'priceUp'} ? 'active' : '')"
                            class="filter-btn">
                        <i class="fas fa-sort-amount-up"></i> Цена ↑
                    </button>
                    <button type="submit"
                            name="sortedBy"
                            value="priceDown"
                            th:class="'filter-btn ' + (${sort == 'priceDown'} ? 'active' : '')"
                            class="filter-btn">
                        <i class="fas fa-sort-amount-down"></i> Цена ↓
                    </button>
                    <button type="submit"
                            name="sortedBy"
                            value="title"
                            th:class="'filter-btn ' + (${sort == 'title'} ? 'active' : '')"
                            class="filter-btn">
                        <i class="fas fa-sort-alpha-down"></i> По названию
                    </button>
                </div>
            </form>
        </div>
    </section>

    <section class="container">
        <div th:if="${totalPage.getContent().isEmpty()}" class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2M4 13h2m8-8V4a1 1 0 00-1-1h-2a1 1 0 00-1 1v1M9 7h6" />
            </svg>
            <h3>Товары не найдены</h3>
            <p>Попробуйте изменить параметры поиска или фильтрации</p>
        </div>

        <div th:unless="${totalPage.getContent().isEmpty()}" class="products-grid">
            <div th:each="prod : ${totalPage.getContent()}" class="product-card">
                <div class="product-image-container">
                    <a th:href="@{/store/catalog/{prod_id}(prod_id = ${prod.id})}">
                        <img th:src="@{'data:image/png;base64,'+${prod.getImages().get(0).convertedImage}}"
                             alt="Product image" class="product-image">
                    </a>

                    <a th:href="@{/store/users/add_favorite/{prod_id}(prod_id = ${prod.id})}"
                       class="favorite-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />
                        </svg>
                    </a>

                    <div th:if="${prod.id % 7 == 0}" class="new-badge">NEW</div>
                </div>

                <div class="product-info">
                    <h3 class="product-title" th:text="${prod.title}"></h3>
                    <p class="product-description" th:text="${prod.description}"></p>
                    <div class="product-price" th:text="${prod.price} + ' BYN'"></div>
                    <div th:replace="~{fragments :: addToCart (${prod.id})}"></div>
                </div>
            </div>
        </div>

        <nav th:if="${totalPage.getTotalPages() > 1}" class="pagination-container">
            <ul class="pagination">
                <li class="page-item" th:each="iterPage : ${countPages}">
                    <form th:action="@{/store/{page}/{size}(page = ${iterPage - 1}, size = ${totalPage.size})}"
                          th:method="get">
                        <input type="hidden" th:value="${searchTitle}" th:name="${searchTitle != null ? 'title' : ''}">
                        <button type="submit"
                                th:value="${sort}"
                                th:text="${iterPage}"
                                th:name="${sort != null ? 'sortedBy' : ''}"
                                th:class="'page-link ' + (${totalPage.number == iterPage - 1} ? 'active' : '')">
                        </button>
                    </form>
                </li>
            </ul>
        </nav>
    </section>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
