<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">Ой! Страница не найдена</h1>
        <p class="error-message">
            <span class="text-danger">Упс!</span> Кажется, мы не можем найти страницу, которую вы ищете.
    </div>
    <div th:if="${errorMessage}" class="alert alert-auth alert-danger">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
    </div>
    <a th:href="@{/store/0/10}" class="error-btn">
        <i class="fas fa-home me-2"></i>
        На главную
    </a>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
