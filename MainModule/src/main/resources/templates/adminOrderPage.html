<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы | Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="admin-page">
    <div class="admin-container">
        <div class="admin-layout">
            <div th:replace="~{fragments :: admin-navigation}"></div>

            <div class="admin-content">
                <div class="admin-header">
                    <h1 class="admin-title">
                        <i class="fas fa-shopping-bag me-2"></i>
                        Управление заказами
                    </h1>
                </div>

                <div class="filters-section">
                    <div class="filters-grid">
                        <div class="filter-group">
                            <label class="filter-label">Сортировка</label>
                            <form th:action="@{/admin/orders/{page}/{size}(page = ${orderContent.number}, size = ${orderContent.size})}" method="get">
                                <input type="hidden" th:value="${searchTitle}" name="title">
                                <input type="hidden" th:value="${searchName}" name="name">
                                <input type="hidden" th:value="${status}" name="status">
                                <div class="filter-buttons">
                                    <button type="submit" name="sortedBy" value="billUp"
                                            th:class="'filter-btn ' + (${sort == 'billUp'} ? 'active' : '')">
                                        <i class="fas fa-sort-amount-up me-1"></i>
                                        Счет возрастает
                                    </button>
                                    <button type="submit" name="sortedBy" value="billDown"
                                            th:class="'filter-btn ' + (${sort == 'billDown'} ? 'active' : '')">
                                        <i class="fas fa-sort-amount-down me-1"></i>
                                        Счет убывает
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Поиск по товару</label>
                            <form th:action="@{/admin/orders/{page}/{size}(page = ${orderContent.number}, size = ${orderContent.size})}">
                                <input type="hidden" th:value="${searchName}" name="name">
                                <input type="hidden" th:value="${sort}" name="sortedBy">
                                <input type="text" name="title" class="filter-input"
                                       placeholder="Название продукта" th:value="${searchTitle}">
                            </form>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Поиск по пользователю</label>
                            <form th:action="@{/admin/orders/{page}/{size}(page = ${orderContent.number}, size = ${orderContent.size})}">
                                <input type="hidden" th:value="${searchTitle}" name="title">
                                <input type="hidden" th:value="${sort}" name="sortedBy">
                                <input type="text" name="name" class="filter-input"
                                       placeholder="Имя пользователя" th:value="${searchName}">
                            </form>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Статус заказа</label>
                            <form th:action="@{/admin/orders/{page}/{size}(page = ${orderContent.number}, size = ${orderContent.size})}">
                                <input type="hidden" th:value="${searchTitle}" name="title">
                                <input type="hidden" th:value="${searchName}" name="name">
                                <input type="hidden" th:value="${sort}" name="sortedBy">
                                <div class="filter-buttons">
                                    <button type="submit" name="status" value="WAITING" class="status-btn status-waiting">
                                        В ожидании
                                    </button>
                                    <button type="submit" name="status" value="IN_PROGRESS" class="status-btn status-progress">
                                        Обрабатывается
                                    </button>
                                    <button type="submit" name="status" value="DONE" class="status-btn status-done">
                                        Готов
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="orders-list">
                    <div th:each="order : ${orderContent.getContent()}" class="order-card">
                        <div class="order-header">
                            <div class="order-info">
                                <span class="order-number">Заказ #<span th:text="${order.id}"></span></span>
                                <span class="order-date" th:text="${order.dateOfPurchase}"></span>
                            </div>
                        </div>

                        <div class="order-body">
                            <div class="order-user">
                                <img th:src="@{'data:image/png;base64,'+ ${order.user.getAvatar()}}"
                                     alt="Аватар" class="user-avatar-sm">
                                <div class="user-details">
                                    <div class="user-name" th:text="${order.user.name}"></div>
                                    <div class="user-role" th:text="${order.user.role}"></div>
                                </div>
                            </div>

                            <div class="order-product">
                                <img th:src="@{'data:image/png;base64,'+${order.product.getImages().get(0).getConvertedImage()}}"
                                     alt="Товар" class="product-image-sm">
                                <div class="product-details">
                                    <div class="product-title" th:text="${order.product.getTitle()}"></div>
                                    <div class="product-quantity">
                                        Количество: <span th:text="${order.countOfProduct}"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="order-summary">
                                <div class="order-bill" th:text="${order.bill} + ' BYN'"></div>
                                <div class="order-count" th:text="'×' + ${order.countOfProduct}"></div>
                            </div>

                            <div class="order-status">
                                <div th:switch="${order.status.name()}">
                                        <span th:case="WAITING" class="status-badge status-waiting">
                                            <i class="fas fa-clock me-1"></i>Ожидание
                                        </span>
                                    <span th:case="IN_PROGRESS" class="status-badge status-progress">
                                            <i class="fas fa-cog me-1"></i>В работе
                                        </span>
                                    <span th:case="DONE" class="status-badge status-done">
                                            <i class="fas fa-check me-1"></i>Готов
                                        </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:replace="~{fragments :: notFoundByFilter(${orderContent.getContent().size()})}"></div>
                </div>

                <div th:if="${orderContent.getTotalPages() > 1}" class="pagination-section">
                    <nav aria-label="Навигация по страницам">
                        <ul class="pagination">
                            <li class="page-item" th:each="iterPage : ${countPages}">
                                <form th:action="@{/admin/orders/{page}/{size}(page = ${iterPage - 1}, size = ${orderContent.size})}" method="get">
                                    <input type="hidden" th:value="${searchTitle}" name="title">
                                    <input type="hidden" th:value="${searchName}" name="name">
                                    <input type="hidden" th:value="${status}" name="status">
                                    <button type="submit" th:value="${sort}" th:text="${iterPage}" name="sortedBy"
                                            th:class="'page-link ' + (${orderContent.number == iterPage - 1} ? 'active' : '')">
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
