<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд - Админ панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.css" rel="stylesheet">
    <link href="/css/App.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="admin-layout">
            <div th:replace="~{fragments :: admin-navigation}"></div>

            <div class="admin-content">
                <div class="admin-header">
                    <h1 class="admin-title">
                        <i class="fas fa-tachometer-alt me-3"></i>
                        Бизнес дашборд
                    </h1>
                </div>

                <div id="errorAlert" class="alert alert-danger error-alert" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="errorMessage"></span>
                </div>

                <div class="filters-section">
                    <form id="dashboardFilters" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Начальная дата</label>
                            <input type="date" id="startDate" name="startDate" class="form-control"
                                   value="">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Конечная дата</label>
                            <input type="date" id="endDate" name="endDate" class="form-control"
                                   value="">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-filter me-2"></i>
                                Применить фильтры
                            </button>
                        </div>
                    </form>

                    <div class="period-info mt-3">
                        <small class="text-muted">
                            <i class="fas fa-calendar me-1"></i>
                            Показаны данные за период:
                            <span id="periodDisplay">-</span>
                        </small>
                    </div>
                </div>
                <div id="loadingSpinner" class="loading-spinner text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                    <p class="mt-2">Загрузка данных...</p>
                </div>

                <div id="dashboardContent" style="display: none;">
                    <div class="row mb-4" id="metricsRow">
                    </div>

                    <div class="row">
                        <div class="col-md-8">
                            <div class="chart-container">
                                <h5 class="mb-3">Динамика продаж и выручки</h5>
                                <canvas id="salesRevenueChart"></canvas>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="chart-container">
                                <h5 class="mb-3">Распределение по категориям</h5>
                                <canvas id="categoryChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="table-card">
                                <h5 class="mb-3">Топ товаров</h5>
                                <div class="table-responsive">
                                    <table class="table table-hover" id="topProductsTable">
                                        <thead>
                                        <tr>
                                            <th>Товар</th>
                                            <th>Продано</th>
                                            <th>Выручка</th>
                                        </tr>
                                        </thead>
                                        <tbody id="topProductsBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="chart-container">
                                <h5 class="mb-3">Воронка конверсии</h5>
                                <canvas id="conversionChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="row" id="inventoryMetrics">
                    </div>
                </div>

                <div id="noDataMessage" class="text-center py-5" style="display: none;">
                    <i class="fas fa-chart-line fa-3x text-muted mb-3"></i>
                    <h4 class="text-muted">Нет данных для отображения</h4>
                    <p class="text-muted">Попробуйте изменить параметры фильтрации</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
